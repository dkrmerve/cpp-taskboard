<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taskboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Taskboard</h1>
    <div class="stats" id="stats" aria-live="polite">
      <span>Total <b id="stat-total">0</b></span>
      <span>Todo <b id="stat-todo">0</b></span>
      <span>In progress <b id="stat-in_progress">0</b></span>
      <span>Done <b id="stat-done">0</b></span>
    </div>
    <span class="health" id="health" title="Backend status">●</span>
  </header>

  <main>
    <form id="task-form" class="task-form" autocomplete="off">
      <input id="title" name="title" type="text" placeholder="New task title" required maxlength="120" />
      <input id="description" name="description" type="text" placeholder="Description (optional)" maxlength="500" />
      <button type="submit">Add</button>
    </form>
    <p id="error" class="error" role="alert" hidden></p>

    <section class="board">
      <div class="column" data-status="todo">
        <h2>Todo</h2>
        <ul class="tasks" id="col-todo"></ul>
      </div>
      <div class="column" data-status="in_progress">
        <h2>In progress</h2>
        <ul class="tasks" id="col-in_progress"></ul>
      </div>
      <div class="column" data-status="done">
        <div class="column-head">
          <h2>Done</h2>
          <button id="clear-done" class="btn-clear" type="button" title="Delete all done tasks">Clear done</button>
        </div>
        <ul class="tasks" id="col-done"></ul>
      </div>
    </section>
  </main>

  <template id="task-template">
    <li class="task">
      <div class="task-body">
        <strong class="task-title"></strong>
        <p class="task-desc"></p>
        <time class="task-time"></time>
      </div>
      <div class="task-actions">
        <button class="btn-prev" title="Move back">◀</button>
        <button class="btn-next" title="Move forward">▶</button>
        <button class="btn-delete" title="Delete">✕</button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
